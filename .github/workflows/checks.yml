name: Checks

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Fast merge gate: the edge-function import guard and the public-URL guard.
      - run: npx vitest run src/test/guards
