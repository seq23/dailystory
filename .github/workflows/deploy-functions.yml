      - name: Force deploy log-security-event specifically
        run: supabase functions deploy log-security-event --project-ref $SUPABASE_PROJECT_ID
      - name: Force deploy model-performance-monitor specifically
        run: supabase functions deploy model-performance-monitor --project-ref $SUPABASE_PROJECT_ID
      - name: Force deploy notification-service specifically
        run: supabase functions deploy notification-service --project-ref $SUPABASE_PROJECT_ID
      - name: Force deploy openai-realtime specifically
        run: supabase functions deploy openai-realtime --project-ref $SUPABASE_PROJECT_ID
