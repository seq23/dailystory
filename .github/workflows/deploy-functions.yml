name: Deploy Edge Functions

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 1.200.3
      - run: supabase functions deploy --project-ref $SUPABASE_PROJECT_ID
      - name: Force deploy activate-discount-code specifically
        run: supabase functions deploy activate-discount-code --project-ref $SUPABASE_PROJECT_ID
      - name: Force deploy ai-visual-scene-creator specifically
        run: supabase functions deploy ai-visual-scene-creator --project-ref $SUPABASE_PROJECT_ID
      - name: Force deploy apply-discount-code specifically
        run: supabase functions deploy apply-discount-code --project-ref $SUPABASE_PROJECT_ID
      - name: Force deploy background-image-pregeneration specifically
        run: supabase functions deploy background-image-pregeneration --project-ref $SUPABASE_PROJECT_ID
      - name: Force deploy check-subscription specifically
        run: supabase functions deploy check-subscription --project-ref $SUPABASE_PROJECT_ID
      - name: Force deploy clear-character-cache specifically
        run: supabase functions deploy clear-character-cache --project-ref $SUPABASE_PROJECT_ID
      - name: Force deploy correct-spelling specifically
        run: supabase functions deploy correct-spelling --project-ref $SUPABASE_PROJECT_ID
      - name: Force deploy create-checkout specifically
        run: supabase functions deploy create-checkout --project-ref $SUPABASE_PROJECT_ID
      - name: Force deploy create-premium-subscription specifically
        run: supabase functions deploy create-premium-subscription --project-ref $SUPABASE_PROJECT_ID
      - name: Force deploy customer-portal specifically
        run: supabase functions deploy customer-portal --project-ref $SUPABASE_PROJECT_ID
      - name: Force deploy elevenlabs-agent-signed-url specifically
        run: supabase functions deploy elevenlabs-agent-signed-url --project-ref $SUPABASE_PROJECT_ID
      - name: Force deploy elevenlabs-dictionary-manager specifically
        run: supabase functions deploy elevenlabs-dictionary-manager --project-ref $SUPABASE_PROJECT_ID
      - name: Force deploy elevenlabs-tts-smart specifically
        run: supabase functions deploy elevenlabs-tts-smart --project-ref $SUPABASE_PROJECT_ID
      - name: Force deploy elevenlabs-tts specifically
        run: supabase functions deploy elevenlabs-tts --project-ref $SUPABASE_PROJECT_ID
      - name: Force deploy generate-adaptive-story specifically
