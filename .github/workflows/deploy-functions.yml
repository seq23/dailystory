name: Deploy Edge Functions

on:
  push:
    branches: [ main ]
  schedule:
    # Daily deployment at 2:00 AM UTC to prevent 404 errors
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      priority_functions:
        description: 'Comma-separated function names to deploy first'
        required: false
        default: ''
# Prevent concurrent deployments to avoid rate limiting
concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      PRIORITY_FUNCTIONS: ${{ github.event.inputs.priority_functions }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Pre-deployment checks
        run: |
          echo "Checking required secrets..."
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ SUPABASE_ACCESS_TOKEN is not set"
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "❌ SUPABASE_PROJECT_ID is not set"
            exit 1
          fi
          echo "✅ All required secrets are configured"
          
      - uses: supabase/setup-cli@v1
        with:
          version: 1.211.0
          
      - name: Function health check (optional)
        run: |
          echo "🏥 Running function health check..."
          
          # Define base URL for function calls
          BASE_URL="https://cpzeuogomaixamrtnnmj.supabase.co/functions/v1"
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwemV1b2dvbWFpeGFtcnRubm1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM5ODQ2NTEsImV4cCI6MjA2OTU2MDY1MX0.3ziDSHAS6XNd73eF5GVEOHW8GpnP03h3NJKqElMyino"
          
          # Test key functions (continue deployment regardless of results)
          for func in "runware-generate-image" "ai-visual-scene-creator" "runware-simple-fallback"; do
            echo "  Testing $func..."
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "$BASE_URL/$func" \
              -H "Authorization: Bearer $ANON_KEY" \
              -H "Content-Type: application/json" \
              -d '{"test": true}' \
              --max-time 10 || echo "000")
            
            if [ "$response" = "404" ]; then
              echo "  ⚠️  $func returned 404 - will be fixed by deployment"
            elif [ "$response" = "000" ]; then
              echo "  ⚠️  $func timeout/error - will be fixed by deployment"
            else
              echo "  ✅ $func responded with HTTP $response"
            fi
          done
          
          echo "✅ Health check completed - proceeding with deployment"
        continue-on-error: true
        
      - name: Smart function discovery and deployment
        run: |
          echo "🔍 Discovering edge functions..."
          
          # Discover all functions with index.ts files
          FUNCTIONS=$(find supabase/functions -name "index.ts" -type f | sed 's|supabase/functions/||' | sed 's|/index.ts||' | sort)
          
          if [ -z "$FUNCTIONS" ]; then
            echo "❌ No functions found"
            exit 1
          fi
          
          echo "📋 Found functions:"
          echo "$FUNCTIONS" | while read -r func; do
            echo "  - $func"
          done
          
          # Convert to array for processing
          FUNC_ARRAY=($FUNCTIONS)
          TOTAL_FUNCTIONS=${#FUNC_ARRAY[@]}
          BATCH_SIZE=5
          SUCCESS_COUNT=0
          FAILED_FUNCTIONS=()
          
          # Parse PRIORITY_FUNCTIONS (comma-separated) and filter to discovered functions
          PRIORITY_RAW="${PRIORITY_FUNCTIONS:-}"
          PRIORITY_LIST=()
          if [ -n "$PRIORITY_RAW" ]; then
            echo "🚩 Priority functions requested: $PRIORITY_RAW"
            IFS=',' read -ra PARR <<< "$PRIORITY_RAW"
            for pf in "${PARR[@]}"; do
              pf_trim=$(echo "$pf" | xargs)
              if echo "$FUNCTIONS" | grep -qx "$pf_trim"; then
                # Avoid duplicates
                if [[ ! " ${PRIORITY_LIST[*]} " =~ " ${pf_trim} " ]]; then
                  PRIORITY_LIST+=("$pf_trim")
                fi
              else
                echo "  ⚠️  Priority function '$pf_trim' not found among discovered functions"
              fi
            done
          fi
          
          # Helper: deploy a single function with retries
          deploy_with_retries() {
            local FUNC_NAME="$1"
            local MAX_RETRIES="$2"
            local BASE_WAIT="$3" # seconds
            local RETRY_COUNT=0
            local DEPLOY_SUCCESS=false
            
            echo "⚡ Deploying $FUNC_NAME..."
            while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$DEPLOY_SUCCESS" = false ]; do
              if [ $RETRY_COUNT -gt 0 ]; then
                WAIT_TIME=$(( (2 ** RETRY_COUNT) * BASE_WAIT ))
                echo "  ⏳ Retry $RETRY_COUNT after ${WAIT_TIME}s (rate limit backoff)..."
                sleep $WAIT_TIME
              fi
              if supabase functions deploy "$FUNC_NAME" --project-ref "$SUPABASE_PROJECT_ID" 2>&1; then
                echo "  ✅ $FUNC_NAME deployed successfully"
                SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
                DEPLOY_SUCCESS=true
              else
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  echo "  ⚠️  $FUNC_NAME deployment failed, retrying..."
                else
                  echo "  ❌ $FUNC_NAME deployment failed after $MAX_RETRIES attempts"
                  FAILED_FUNCTIONS+=("$FUNC_NAME")
                fi
              fi
            done
          }
          
          echo "🚀 Starting prioritized deployment (if any)..."
          # Deploy priority functions first, sequentially, with stronger backoff (5 retries, 30s base)
          if [ ${#PRIORITY_LIST[@]} -gt 0 ]; then
            for FUNC_NAME in "${PRIORITY_LIST[@]}"; do
              deploy_with_retries "$FUNC_NAME" 5 30
              # Small delay between priority functions to avoid rate limiting
              sleep 10
            done
          fi
          
          # Build remaining function list (exclude priority)
          REMAINING_FUNCTIONS=()
          for f in "${FUNC_ARRAY[@]}"; do
            skip=false
            for p in "${PRIORITY_LIST[@]}"; do
              if [ "$f" = "$p" ]; then
                skip=true
                break
              fi
            done
            if [ "$skip" = false ]; then
              REMAINING_FUNCTIONS+=("$f")
            fi
          done
          
          TOTAL_REMAINING=${#REMAINING_FUNCTIONS[@]}
          echo "🚀 Starting deployment of $TOTAL_REMAINING remaining functions in batches of $BATCH_SIZE..."
          
          # Deploy remaining functions in batches with existing rate limiting
          for ((i=0; i<$TOTAL_REMAINING; i+=BATCH_SIZE)); do
            BATCH_END=$((i + BATCH_SIZE - 1))
            if [ $BATCH_END -ge $TOTAL_REMAINING ]; then
              BATCH_END=$((TOTAL_REMAINING - 1))
            fi
            
            echo "📦 Processing batch $((i/BATCH_SIZE + 1)): functions $((i+1))-$((BATCH_END+1))"
            
            for ((j=i; j<=BATCH_END && j<TOTAL_REMAINING; j++)); do
              FUNC_NAME="${REMAINING_FUNCTIONS[$j]}"
              deploy_with_retries "$FUNC_NAME" 3 10
              # Small delay between functions to avoid rate limiting
              sleep 5
            done
            
            # Longer delay between batches to ensure rate limit recovery
            if [ $((BATCH_END + 1)) -lt $TOTAL_REMAINING ]; then
              echo "  ⏸️  Waiting 30s before next batch..."
              sleep 30
            fi
          done
          
          # Final deployment summary
          echo ""
          echo "📊 Deployment Summary:"
          echo "  ✅ Successfully deployed: $SUCCESS_COUNT/$TOTAL_FUNCTIONS functions"
          
          if [ ${#FAILED_FUNCTIONS[@]} -eq 0 ]; then
            echo "  🎉 All functions deployed successfully!"
          else
            echo "  ❌ Failed functions: ${FAILED_FUNCTIONS[*]}"
            echo "  ⚠️  Some functions failed to deploy, but continuing..."
          fi
          
      - name: Deployment verification
        run: |
          echo "🔍 Verifying deployed functions..."
          
          # List all functions from Supabase
          echo "📋 Functions in Supabase dashboard:"
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID" || echo "⚠️  Could not list functions"
          
          echo "✅ Deployment verification completed"
        continue-on-error: true
