name: Deploy Edge Functions

on:
  push:
    branches: [ main ]
  schedule:
    # Daily deployment at 2:00 AM UTC to prevent 404 errors
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      priority_functions:
        description: 'Comma-separated list of priority functions to deploy first'
        required: false
        default: ''
      target_function:
        description: 'Single function to deploy (for targeted redeployments)'
        required: false
        default: ''
# Smart concurrency control - different strategies based on trigger type
concurrency:
  group: supabase-edge-functions-${{ github.event_name == 'push' && 'push' || 'queue' }}
  cancel-in-progress: ${{ github.event_name == 'push' && 'true' || 'false' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      PRIORITY_FUNCTIONS: ${{ github.event.inputs.priority_functions }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Smart deployment coordination
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine deployment strategy based on trigger
          TRIGGER_TYPE="${{ github.event_name }}"
          CONCURRENCY_GROUP="supabase-edge-functions-$([ "$TRIGGER_TYPE" = "push" ] && echo "push" || echo "queue")"
          CANCEL_MODE="$([ "$TRIGGER_TYPE" = "push" ] && echo "true" || echo "false")"
          
          echo "🚀 SMART DEPLOYMENT COORDINATION"
          echo "  Trigger: $TRIGGER_TYPE"
          echo "  Concurrency Group: $CONCURRENCY_GROUP"
          echo "  Cancel Previous: $CANCEL_MODE"
          echo "  Strategy: $([ "$TRIGGER_TYPE" = "push" ] && echo "Cancel older pending deployments" || echo "Queue deployment properly")"
          echo ""
          
          # Check for conflicting deployments from different trigger types
          echo "🔍 Checking for deployment conflicts..."
          OTHER_GROUP="supabase-edge-functions-$([ "$TRIGGER_TYPE" = "push" ] && echo "queue" || echo "push")"
          
          ACTIVE_DEPLOYMENTS=$(curl -s \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?status=in_progress&workflow_id=deploy-functions.yml" \
            | jq -r '.workflow_runs | length' || echo "0")
          
          if [ "$ACTIVE_DEPLOYMENTS" -gt 1 ]; then
            echo "⚠️  Found $ACTIVE_DEPLOYMENTS concurrent deployments"
            echo "🔄 Smart coordination will handle conflicts automatically"
          else
            echo "✅ No deployment conflicts detected"
          fi
          echo ""
          echo "🔐 Checking required secrets..."
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ SUPABASE_ACCESS_TOKEN is not set"
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "❌ SUPABASE_PROJECT_ID is not set"
            exit 1
          fi
          echo "✅ All required secrets are configured"
          
          # Add deployment status reporting
          echo "📊 DEPLOYMENT STATUS REPORT"
          echo "  Repository: $GITHUB_REPOSITORY"
          echo "  Commit: ${GITHUB_SHA:0:8}"
          echo "  Actor: $GITHUB_ACTOR"
          echo "  Run ID: $GITHUB_RUN_ID"
          if [ "$TRIGGER_TYPE" = "push" ]; then
            echo "  Mode: Fast deployment (cancels pending)"
          elif [ "$TRIGGER_TYPE" = "schedule" ]; then
            echo "  Mode: Scheduled deployment (queued)"
          else
            echo "  Mode: Manual deployment (queued)"
          fi
          echo ""
          
      - uses: supabase/setup-cli@v1
        with:
          version: 1.211.0
          
      - name: Function health check (optional)
        run: |
          echo "🏥 Running function health check..."
          
          # Define base URL for function calls
          BASE_URL="https://cpzeuogomaixamrtnnmj.supabase.co/functions/v1"
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwemV1b2dvbWFpeGFtcnRubm1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM5ODQ2NTEsImV4cCI6MjA2OTU2MDY1MX0.3ziDSHAS6XNd73eF5GVEOHW8GpnP03h3NJKqElMyino"
          
          # Test key functions (continue deployment regardless of results)
          for func in "runware-generate-image" "ai-visual-scene-creator" "runware-simple-fallback"; do
            echo "  Testing $func..."
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "$BASE_URL/$func" \
              -H "Authorization: Bearer $ANON_KEY" \
              -H "Content-Type: application/json" \
              -d '{"test": true}' \
              --max-time 10 || echo "000")
            
            if [ "$response" = "404" ]; then
              echo "  ⚠️  $func returned 404 - will be fixed by deployment"
            elif [ "$response" = "000" ]; then
              echo "  ⚠️  $func timeout/error - will be fixed by deployment"
            else
              echo "  ✅ $func responded with HTTP $response"
            fi
          done
          
          echo "✅ Health check completed - proceeding with deployment"
        continue-on-error: true
        
      - name: Smart function discovery and deployment
        run: |
          echo "🔍 Discovering edge functions..."
          
          # Discover all functions with index.ts files
          FUNCTIONS=$(find supabase/functions -name "index.ts" -type f | sed 's|supabase/functions/||' | sed 's|/index.ts||' | sort)
          
          if [ -z "$FUNCTIONS" ]; then
            echo "❌ No functions found"
            exit 1
          fi
          
          echo "📋 Found functions:"
          echo "$FUNCTIONS" | while read -r func; do
            echo "  - $func"
          done
          
          # Convert to array for processing
          all_functions=($FUNCTIONS)
          echo "📋 Discovered functions: ${all_functions[*]}"
          echo "📦 Total functions to deploy: ${#all_functions[@]}"
          
          # Check for targeted single function deployment first
          if [ -n "${{ github.event.inputs.target_function }}" ]; then
            target_func="${{ github.event.inputs.target_function }}"
            echo "🎯 TARGETED DEPLOYMENT: $target_func only"
            deploy_functions=("$target_func")
          # Determine deployment strategy based on inputs
          elif [ -n "${{ github.event.inputs.priority_functions }}" ]; then
            echo "🚩 Priority functions requested: ${{ github.event.inputs.priority_functions }}"
            IFS=',' read -ra PRIORITY_ARRAY <<< "${{ github.event.inputs.priority_functions }}"
            deploy_functions=("${PRIORITY_ARRAY[@]}")
            # Add remaining functions
            for func in "${all_functions[@]}"; do
              if [[ ! " ${PRIORITY_ARRAY[*]} " =~ " ${func} " ]]; then
                deploy_functions+=("$func")
              fi
            done
          else
            # Deploy all functions in discovered order
            deploy_functions=("${all_functions[@]}")
          fi

          BATCH_SIZE=5
          successful_deployments=()
          failed_deployments=()
          
          # Helper: deploy a single function with retries
          deploy_with_retries() {
            local FUNC_NAME="$1"
            local MAX_RETRIES="$2"
            local BASE_WAIT="$3" # seconds
            local RETRY_COUNT=0
            local DEPLOY_SUCCESS=false
            
            echo "⚡ Deploying $FUNC_NAME..."
            while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$DEPLOY_SUCCESS" = false ]; do
              if [ $RETRY_COUNT -gt 0 ]; then
                WAIT_TIME=$(( (2 ** RETRY_COUNT) * BASE_WAIT ))
                echo "  ⏳ Retry $RETRY_COUNT after ${WAIT_TIME}s (rate limit backoff)..."
                sleep $WAIT_TIME
              fi
              if supabase functions deploy "$FUNC_NAME" --project-ref "$SUPABASE_PROJECT_ID" 2>&1; then
                echo "  ✅ $FUNC_NAME deployed successfully"  
                successful_deployments+=("$FUNC_NAME")
                DEPLOY_SUCCESS=true
              else
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  echo "  ⚠️  $FUNC_NAME deployment failed, retrying..."
                else
                  echo "  ❌ $FUNC_NAME deployment failed after $MAX_RETRIES attempts"
                  failed_deployments+=("$FUNC_NAME")
                fi
              fi
            done
          }
          
          echo "🚀 Starting deployment..."
          
          # Deploy functions sequentially with rate limiting  
          for ((i=0; i<${#deploy_functions[@]}; i++)); do
            FUNC_NAME="${deploy_functions[$i]}"
            deploy_with_retries "$FUNC_NAME" 3 10
            
            # Rate limiting: sleep between deployments
            if [ $i -lt $((${#deploy_functions[@]} - 1)) ]; then
              echo "  ⏸️  Waiting 10s before next deployment..."
              sleep 10
            fi
          done
          
          echo "🚀 Starting prioritized deployment (if any)..."
          # Deploy priority functions first, sequentially, with stronger backoff (5 retries, 30s base)
          if [ ${#PRIORITY_LIST[@]} -gt 0 ]; then
            for FUNC_NAME in "${PRIORITY_LIST[@]}"; do
              deploy_with_retries "$FUNC_NAME" 5 30
              # Small delay between priority functions to avoid rate limiting
              sleep 10
            done
          fi
          
          # Build remaining function list (exclude priority)
          REMAINING_FUNCTIONS=()
          for f in "${FUNC_ARRAY[@]}"; do
            skip=false
            for p in "${PRIORITY_LIST[@]}"; do
              if [ "$f" = "$p" ]; then
                skip=true
                break
              fi
            done
            if [ "$skip" = false ]; then
              REMAINING_FUNCTIONS+=("$f")
            fi
          done
          
          TOTAL_REMAINING=${#REMAINING_FUNCTIONS[@]}
          echo "🚀 Starting deployment of $TOTAL_REMAINING remaining functions in batches of $BATCH_SIZE..."
          
          # Deploy remaining functions in batches with existing rate limiting
          for ((i=0; i<$TOTAL_REMAINING; i+=BATCH_SIZE)); do
            BATCH_END=$((i + BATCH_SIZE - 1))
            if [ $BATCH_END -ge $TOTAL_REMAINING ]; then
              BATCH_END=$((TOTAL_REMAINING - 1))
            fi
            
            echo "📦 Processing batch $((i/BATCH_SIZE + 1)): functions $((i+1))-$((BATCH_END+1))"
            
            for ((j=i; j<=BATCH_END && j<TOTAL_REMAINING; j++)); do
              FUNC_NAME="${REMAINING_FUNCTIONS[$j]}"
              deploy_with_retries "$FUNC_NAME" 3 10
              # Small delay between functions to avoid rate limiting
              sleep 5
            done
            
            # Longer delay between batches to ensure rate limit recovery
            if [ $((BATCH_END + 1)) -lt $TOTAL_REMAINING ]; then
              echo "  ⏸️  Waiting 30s before next batch..."
              sleep 30
            fi
          done
          
          # Final deployment summary
          echo ""
          echo "📊 Deployment Summary:"
          echo "  ✅ Successfully deployed: $SUCCESS_COUNT/$TOTAL_FUNCTIONS functions"
          
          if [ ${#FAILED_FUNCTIONS[@]} -eq 0 ]; then
            echo "  🎉 All functions deployed successfully!"
          else
            echo "  ❌ Failed functions: ${FAILED_FUNCTIONS[*]}"
            echo "  ⚠️  Some functions failed to deploy, but continuing..."
          fi
          
          echo ""
          echo "📋 Deployment Summary:"
          echo "  Functions deployed successfully: ${#successful_deployments[@]}"
          echo "  Functions that failed: ${#failed_deployments[@]}"
          
          if [ ${#successful_deployments[@]} -gt 0 ]; then
            echo "  ✅ Successful: ${successful_deployments[*]}"
          fi
          
          if [ ${#failed_deployments[@]} -gt 0 ]; then
            echo "  ❌ Failed: ${failed_deployments[*]}"
          fi
          
          # Verify deployment with supabase functions list
          echo ""
          echo "🔍 Verifying deployment..."
          supabase functions list --project-ref $SUPABASE_PROJECT_ID || echo "⚠️ Could not verify deployment"

      - name: Post-Deploy Function Warm-Up
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔥 Starting post-deploy warm-up sequence..."
          
          # Function configuration
          BASE_URL="https://cpzeuogomaixamrtnnmj.supabase.co/functions/v1"
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwemV1b2dvbWFpeGFtcnRubW1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM5ODQ2NTEsImV4cCI6MjA2OTU2MDY1MX0.3ziDSHAS6XNd73eF5GVEOHW8GpnP03h3NJKqElMyino"
          
          # Critical functions and their required secrets
          declare -A FUNCTIONS_SECRETS
          FUNCTIONS_SECRETS["runware-generate-image"]="RUNWARE_API_KEY,OPENAI_API_KEY,SUPABASE_SERVICE_ROLE_KEY"
          FUNCTIONS_SECRETS["ai-visual-scene-creator"]="OPENAI_API_KEY"
          FUNCTIONS_SECRETS["runware-template-ab"]="RUNWARE_API_KEY"
          FUNCTIONS_SECRETS["runware-template-cd"]="RUNWARE_API_KEY"
          
          CRITICAL_FUNCTIONS=("runware-generate-image" "ai-visual-scene-creator" "runware-template-ab" "runware-template-cd")
          FAILED_WARMUPS=()
          
          # Wait 2 minutes after deployment for functions to stabilize
          echo "⏳ Waiting 2 minutes for deployment to stabilize..."
          sleep 120
          
          # Warm up each function with staggered timing
          for i in "${!CRITICAL_FUNCTIONS[@]}"; do
            func="${CRITICAL_FUNCTIONS[$i]}"
            required_secrets="${FUNCTIONS_SECRETS[$func]}"
            
            echo ""
            echo "🔥 Warming up $func (${i+1}/${#CRITICAL_FUNCTIONS[@]})..."
            echo "   Required secrets: $required_secrets"
            
            # Test function health with retries
            ATTEMPTS=0
            MAX_ATTEMPTS=3
            SUCCESS=false
            
            while [ $ATTEMPTS -lt $MAX_ATTEMPTS ] && [ "$SUCCESS" = false ]; do
              ATTEMPTS=$((ATTEMPTS + 1))
              echo "  🔍 Warm-up attempt $ATTEMPTS/$MAX_ATTEMPTS for $func..."
              
              response=$(curl -s -o /dev/null -w "%{http_code}" \
                -X GET "$BASE_URL/$func" \
                -H "Authorization: Bearer $ANON_KEY" \
                -H "Content-Type: application/json" \
                --max-time 20 \
                --retry 1 \
                --retry-delay 3 || echo "000")
              
              case $response in
                "200"|"201"|"202")
                  echo "    ✅ $func warmed up successfully (HTTP $response)"
                  SUCCESS=true
                  ;;
                "404")
                  echo "    ❌ $func returned 404 (function not deployed properly)"
                  if [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; then
                    echo "    ⏳ Waiting 10s before retry..."
                    sleep 10
                  fi
                  ;;
                "500")
                  echo "    ⚠️  $func returned 500 (check secrets: $required_secrets)"
                  if [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; then
                    echo "    ⏳ Waiting 10s before retry..."
                    sleep 10
                  fi
                  ;;
                "000")
                  echo "    ❌ $func is unreachable (timeout/network error)"
                  if [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; then
                    echo "    ⏳ Waiting 10s before retry..."
                    sleep 10
                  fi
                  ;;
                *)
                  echo "    ⚠️  $func responded with HTTP $response"
                  if [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; then
                    echo "    ⏳ Waiting 10s before retry..."
                    sleep 10
                  fi
                  ;;
              esac
            done
            
            # Track failed warm-ups
            if [ "$SUCCESS" = false ]; then
              echo "    ❌ $func failed warm-up after $MAX_ATTEMPTS attempts"
              FAILED_WARMUPS+=("$func")
            fi
            
            # Stagger warm-ups (except for the last function)
            if [ $i -lt $((${#CRITICAL_FUNCTIONS[@]} - 1)) ]; then
              echo "    ⏳ Waiting 60s before next function..."
              sleep 60
            fi
          done
          
          echo ""
          echo "🔥 Warm-up Summary:"
          echo "  Functions tested: ${#CRITICAL_FUNCTIONS[@]}"
          echo "  Functions failed: ${#FAILED_WARMUPS[@]}"
          
          if [ ${#FAILED_WARMUPS[@]} -eq 0 ]; then
            echo "  ✅ All functions warmed up successfully"
          else
            echo "  ❌ Failed warm-ups: ${FAILED_WARMUPS[*]}"
            echo ""
            echo "🚨 Re-queueing targeted redeployments for failed functions..."
            
            # Trigger targeted redeployments for failed functions
            for failed_func in "${FAILED_WARMUPS[@]}"; do
              echo "  ⚡ Triggering redeploy for $failed_func..."
              
              curl -X POST \
                -H "Accept: application/vnd.github.v3+json" \
                -H "Authorization: token $GITHUB_TOKEN" \
                https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-functions.yml/dispatches \
                -d '{"ref":"main","inputs":{"target_function":"'$failed_func'"}}'
            done
            
            echo "  ✅ Targeted redeployments queued for ${#FAILED_WARMUPS[@]} functions"
          fi
