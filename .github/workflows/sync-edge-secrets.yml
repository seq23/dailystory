name: Sync edge function secrets

# Copies product-lane keys held as GitHub repo secrets into the Supabase Edge Function
# secrets, so a key never has to be typed into a dashboard. Run by hand after a key changes.
# OPENROUTER_API_KEY (26 Oct 2026): the $0 backup; only :free models are called.
# GEMINI_API_KEY (26 Oct 2026): primary story/word model, PAID pay-as-you-go project (paid-tier
# inputs are not used for training; prompts carry children's names).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # 26 Oct 2026: Cloudflare Workers AI free allocation, the second free lane in the text chain.
      CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Set secrets that are present
        run: |
          set -euo pipefail
          body='[]'
          for n in OPENROUTER_API_KEY GEMINI_API_KEY CLOUDFLARE_WORKERS_AI_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            v="${!n:-}"
            if [ -z "$v" ]; then echo "::warning::repo secret $n is not set; skipped"; continue; fi
            body=$(jq -c --arg n "$n" --arg v "$v" '. + [{name:$n, value:$v}]' <<<"$body")
          done
          [ "$(jq length <<<"$body")" -gt 0 ] || { echo "::error::NAMED STOP: no repo secrets to sync"; exit 1; }
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/secrets" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" -d "$body")
          echo "Supabase answered $code"
          [ "$code" = "200" ] || [ "$code" = "201" ] || { head -c 300 /tmp/out; exit 1; }
          listed=$(curl -s "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/secrets" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" | jq -r '.[].name')
          for n in $(jq -r '.[].name' <<<"$body"); do
            grep -qx "$n" <<<"$listed" || { echo "::error::$n not listed after setting it"; exit 1; }
            echo "$n is set on the project."
          done
