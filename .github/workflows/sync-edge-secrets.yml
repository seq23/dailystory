name: Sync edge function secrets

# Copies product-lane keys held as GitHub repo secrets into the Supabase Edge Function
# secrets, so a key never has to be typed into a dashboard. Run by hand after a key changes.
# OPENROUTER_API_KEY (26 Oct 2026): the $0 fallback behind OpenAI; only :free models are called.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Set secrets that are present
        run: |
          set -euo pipefail
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::NAMED STOP: repo secret OPENROUTER_API_KEY is not set"; exit 1
          fi
          body=$(jq -n --arg v "$OPENROUTER_API_KEY" '[{name:"OPENROUTER_API_KEY", value:$v}]')
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/secrets" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" -d "$body")
          echo "Supabase answered $code"
          [ "$code" = "200" ] || [ "$code" = "201" ] || { head -c 300 /tmp/out; exit 1; }
          names=$(curl -s "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/secrets" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" | jq -r '.[].name' | grep -c '^OPENROUTER_API_KEY$' || true)
          [ "$names" = "1" ] || { echo "::error::OPENROUTER_API_KEY not listed after setting it"; exit 1; }
          echo "OPENROUTER_API_KEY is set on the project."
