name: Monitor Template CD

on:
  schedule:
    # Check daily at 1:45 AM CT (cost optimized: 1x/day, staggered +45min)
    - cron: '45 1 * * *'  # America/Chicago, all year
      timezone: America/Chicago
  workflow_dispatch:

# Unified deployment concurrency - prevents race conditions
concurrency:
  group: monitor-edge-functions
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
      contents: read
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Check function health (GET /health)
        id: health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/monitor/function-health.sh runware-template-cd

      - name: Trigger targeted redeploy (on failure)
        if: failure() && steps.health.outputs.failed != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED: ${{ steps.health.outputs.failed }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-functions.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"priority_functions\":\"$FAILED\"}}"
          echo "Targeted redeploy dispatched for $FAILED"

      - name: Create alert issue (on failure)
        if: failure()
        run: |
          echo "📝 Creating GitHub issue for runware-template-cd failure..."
          
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/$GITHUB_REPOSITORY/issues \
            -d '{
              "title": "🚨 runware-template-cd Health Alert - '"$(date '+%Y-%m-%d %H:%M UTC')"'",
              "body": "## Function Health Alert\n\n**Time:** '"$(date '+%Y-%m-%d %H:%M UTC')"'\n**Function:** runware-template-cd\n\n**Issue:** Function experiencing persistent failures after 2 consecutive health checks.\n\n**Actions Taken:**\n- Automatic health check failed\n- Targeted redeploy triggered\n\n**Next Steps:**\n1. Check function logs in Supabase dashboard\n2. Verify RUNWARE_API_KEY secret\n3. Test function manually if needed\n\n**Monitoring:** This issue was created automatically by the staggered health monitoring system.",
              "labels": ["bug", "edge-functions", "runware-template-cd", "automated-alert"]
            }'