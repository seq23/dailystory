# Read-only: the distinct reading-level / grade values stored in production, with
# counts only (no names, no ids), so docs/reading-levels.md can say how each legacy
# value is normalized. Runs on PRs that touch the level map, and by hand.
name: level-values-report
on:
  workflow_dispatch:
  pull_request:
    paths:
      - docs/reading-levels.md
      - .github/workflows/level-values-report.yml
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Distinct stored level values (counts only)
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "NAMED STOP: SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID not available to this run (fork PR?)."; exit 0
          fi
          q() {
            body=$(jq -n --arg q "$2" '{query: $q, read_only: true}')
            code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data "$body")
            echo "### $1 (HTTP $code)" | tee -a "$GITHUB_STEP_SUMMARY"
            jq -r 'if type=="array" then .[] | "| \(.v) | \(.n) |" else tostring end' /tmp/r.json | tee -a "$GITHUB_STEP_SUMMARY"
          }
          q "profiles.reading_level" "select coalesce(reading_level,'(null)') v, count(*) n from public.profiles group by 1 order by 2 desc"
          q "profiles.difficulty_level" "select coalesce(difficulty_level,'(null)') v, count(*) n from public.profiles group by 1 order by 2 desc"
          q "profiles.grade_level" "select coalesce(grade_level,'(null)') v, count(*) n from public.profiles group by 1 order by 2 desc"
          q "child_profiles.grade_level" "select coalesce(grade_level,'(null)') v, count(*) n from public.child_profiles group by 1 order by 2 desc"
          q "child_profiles.reading_grade" "select coalesce(reading_grade,'(null)') v, count(*) n from public.child_profiles group by 1 order by 2 desc"
          q "user_preferences.reading_preferences.minDifficulty" "select coalesce(reading_preferences->>'minDifficulty','(null)') v, count(*) n from public.user_preferences group by 1 order by 2 desc"
          q "user_preferences.reading_preferences.minExpertGrade" "select coalesce(reading_preferences->>'minExpertGrade','(null)') v, count(*) n from public.user_preferences group by 1 order by 2 desc"
          q "stories.reading_level" "select coalesce(reading_level,'(null)') v, count(*) n from public.stories group by 1 order by 2 desc"
